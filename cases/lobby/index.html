<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Sketch to Physics — Lobby</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #2e251d; font-family: -apple-system, sans-serif; }
  #canvas { width: 100vw; height: 100vh; }
  .brand-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 48px;
    background: rgba(42, 32, 22, 0.95);
    display: flex; align-items: center; padding: 0 20px;
    z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .brand-title {
    color: #f0e6d2; font-size: 16px; font-weight: 700; letter-spacing: 3px;
  }
  .brand-actions { margin-left: auto; display: flex; gap: 12px; }
  .brand-btn {
    background: rgba(255,255,255,0.08); color: #f0e6d2; border: none;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }
  .brand-btn:hover { background: rgba(255,255,255,0.15); }
  .brand-btn svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="brand-bar">
  <div class="brand-title">SKETCH TO PHYSICS</div>
  <div class="brand-actions">
    <button class="brand-btn" onclick="toggleFullscreen()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      Fullscreen
    </button>
  </div>
</div>
<div id="canvas"></div>
<script>
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { createWoodTableTexture, createPaperWithSketchTexture } from '/src/textures.js';
import { Environment } from '/src/environment.js';
import { sound } from '/src/audio.js';

// ---------------------------------------------------------------------------
// Scene / renderer — mirrors main.js initThree() exactly
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2e251d'); // main.js line 144

const CAM_FOV = 38; // main.js line 147
const camera = new THREE.PerspectiveCamera(CAM_FOV, innerWidth / innerHeight, 0.1, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.getElementById('canvas').appendChild(renderer.domElement);

// NOTE: main.js NEVER sets scene.environment — it only stores the
// RoomEnvironment PMREM on `this.envMapTexture` and selectively assigns it to
// individual metal materials. In three r160 `scene.environmentIntensity` does
// NOT exist (added r163), so setting scene.environment here would leak extra
// neutral-cool IBL onto the wood desk / props and brighten/cool the look.
// We therefore leave scene.environment unset, exactly like main.js.

// ---------------------------------------------------------------------------
// Lighting rig — copied verbatim from main.js initThree() (Environment class
// itself adds NO lights; the light rig lives in main.js, so we replicate it
// here for visual parity)
// ---------------------------------------------------------------------------
const ambientLight = new THREE.AmbientLight(0xffeed9, 0.95);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfffaec, 2.3);
sunLight.position.set(-2.5, 4.5, 3.2);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 15;
sunLight.shadow.camera.left = -2.8;
sunLight.shadow.camera.right = 2.8;
sunLight.shadow.camera.top = 2.8;
sunLight.shadow.camera.bottom = -2.8;
sunLight.shadow.bias = -0.0004;
sunLight.shadow.radius = 3.0;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0xdce7f6, 0.6);
fillLight.position.set(3, 2, -1);
scene.add(fillLight);

// ---------------------------------------------------------------------------
// Reuse the exact Environment (wood desk / paper / pencil / eraser)
// ---------------------------------------------------------------------------
const woodTex = createWoodTableTexture();
const paperSketchTex = createPaperWithSketchTexture(true);
const paperCleanTex = createPaperWithSketchTexture(false);
const env = new Environment(scene, woodTex, paperSketchTex, paperCleanTex);

// Hide the big sheet — the lobby only shows the 2 small blueprint cards
env.paperMesh.visible = false;

// Desk props at natural size
// env.pencilGroup.scale.setScalar(0.5);
// env.eraserGroup.scale.setScalar(0.5);

// simple sound effects via WebAudio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playPickup() {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.frequency.setValueAtTime(400, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.1);
  g.gain.setValueAtTime(0.1, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  o.connect(g).connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.15);
}
function playDrop() {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.frequency.setValueAtTime(200, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
  g.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
  o.connect(g).connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.12);
}
const tourAudio = sound;
function playPaper() {
  tourAudio.playPaperSlide();
}

// pencil / eraser: drag to pick up, move, release = drop with gravity
const pencil = env.pencilGroup;
const eraser = env.eraserGroup;
let dragging = null;
let dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let dragOffset = new THREE.Vector3();

function pickProp(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects([pencil, eraser], true);
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj && obj !== pencil && obj !== eraser) obj = obj.parent;
  return obj;
}

renderer.domElement.addEventListener('mousedown', (e) => {
  const p = pickProp(e);
  if (p) {
    dragging = p;
    dragPlane.constant = -p.position.y;
    const hitPoint = new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane, hitPoint);
    dragOffset.copy(p.position).sub(hitPoint);
    // pickup: lift up + lighten shadow
    p.userData.baseY = p.position.y;
    p.position.y = p.userData.baseY + 0.1;
    p.traverse(o => { if (o.material) o.material.opacity = 0.9; });
    playPickup();
  }
});

renderer.domElement.addEventListener('mousemove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  if (dragging) {
    const hitPoint = new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane, hitPoint);
    dragging.position.x = hitPoint.x + dragOffset.x;
    dragging.position.z = hitPoint.z + dragOffset.z;
    if (hovered) { hovered = null; cardGroups.forEach(g => g.userData.targetY = 0.001); }
    return;
  }
  const p = pickProp(e);
  renderer.domElement.style.cursor = p ? 'grab' : 'default';
  if (p) { hovered = null; return; } // over prop: no card lift
  const hits = raycaster.intersectObjects(clickableMeshes, false);
  const target = hits.length ? hits[0].object.parent : null;
  if (hovered !== target) {
    hovered = target;
    if (hovered) playPaper();
    cardGroups.forEach((g) => {
      g.userData.targetY = (g === hovered) ? 0.02 : 0.001;
    });
  }
});

window.addEventListener('mouseup', () => {
  if (dragging) {
    dragging.userData.dropY = dragging.userData.baseY || 0.02;
    dragging.userData.playDrop = true;
    dragging = null;
    window._justDragged = true;
  }
});

// ---------------------------------------------------------------------------
// Top camera — replicates main.js setCameraView('Top'):
//   look = (0.12, 0.12, 0); fit width 3.3 / depth 2.2;
//   pos  = (0.12, 0.12 + d, 0.01)  (near-vertical overhead)
// ---------------------------------------------------------------------------
function fitTopCamera() {
  const aspect = innerWidth / innerHeight;
  const vFov = THREE.MathUtils.degToRad(CAM_FOV);
  const tanHalf = Math.tan(vFov / 2);
  const look = new THREE.Vector3(0.12, 0.12, 0);
  const dForHeight = 2.2 / (2 * tanHalf);
  const dForWidth = 3.3 / (2 * tanHalf * aspect);
  const d = Math.max(dForHeight, dForWidth) + 0.15;
  camera.position.set(look.x, look.y + d, look.z + 0.01);
  camera.lookAt(look);
}
fitTopCamera();

// ---------------------------------------------------------------------------
// Two blueprint cards lying flat on the desk. sketch.jpg is 1568x1600
// (~0.98:1 near-square), so the plane matches that aspect to avoid stretching.
// ---------------------------------------------------------------------------
const sketchTex = new THREE.TextureLoader().load('lobby-assets/newton-cradle.jpg', (t) => {
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
});

// trebuchet blueprint: white paper + trebuchet sketch line art
const tbCanvas = document.createElement('canvas');
tbCanvas.width = 1024; tbCanvas.height = 700;
const tbCtx = tbCanvas.getContext('2d');
tbCtx.fillStyle = '#f7f4ea';
tbCtx.fillRect(0, 0, 1024, 700);
const tbImg = new Image();
tbImg.onload = () => {
  tbCtx.drawImage(tbImg, 0, 0, 1024, 700);
  trebuchetTex.needsUpdate = true;
};
tbImg.src = 'lobby-assets/trebuchet.png';
const trebuchetTex = new THREE.CanvasTexture(tbCanvas);
trebuchetTex.colorSpace = THREE.SRGBColorSpace;

const CARD_W = 1.35;
const CARD_H = 0.925;

const isLocal = location.hostname === 'localhost';
const cardDefs = [
  { url: isLocal ? 'http://localhost:5173/' : '/cases/trebuchet/dist/', x: -0.55, z: 0.15, yaw: -0.12, tex: trebuchetTex },
  { url: isLocal ? 'http://localhost:5174/' : '/cases/newton-cradle/dist/', x: 0.65, z: -0.15, yaw: 0.1, tex: sketchTex },
];

const clickableMeshes = [];
const cardGroups = [];
cardDefs.forEach((c) => {
  const group = new THREE.Group();
  group.position.set(c.x, 0.001, c.z);
  group.rotation.y = c.yaw;

  const mat = new THREE.MeshStandardMaterial({
    map: c.tex,
    roughness: 0.9,
    metalness: 0.0,
    side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  mesh.userData.url = c.url;
  group.add(mesh);

  scene.add(group);
  clickableMeshes.push(mesh);
  cardGroups.push(group);
});

// hover lift
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null;
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  fitTopCamera();
});

renderer.domElement.addEventListener('click', (e) => {
  if (window._justDragged) { window._justDragged = false; return; }
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickableMeshes, false);
  if (hits.length && hits[0].object.userData.url) {
    window.location.href = hits[0].object.userData.url;
  }
});

function animate() {
  requestAnimationFrame(animate);
  cardGroups.forEach((g) => {
    const target = g.userData.targetY ?? 0.001;
    g.position.y += (target - g.position.y) * 0.1;
  });
  // pencil / eraser drop gravity
  [pencil, eraser].forEach((prop) => {
    if (prop.userData.dropY !== undefined && prop.position.y > prop.userData.dropY) {
      prop.position.y -= 0.02;
      if (prop.position.y <= prop.userData.dropY) {
        prop.position.y = prop.userData.dropY;
        if (prop.userData.playDrop) { playDrop(); delete prop.userData.playDrop; }
        delete prop.userData.dropY;
      }
    }
  });
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
