<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newton's Cradle — Sketch to Physics (Claude Replica)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <!-- Brand bar -->
  <div style="position:fixed;top:0;left:0;right:0;height:48px;background:rgba(42,32,22,0.95);display:flex;align-items:center;padding:0 20px;z-index:1000;border-bottom:1px solid rgba(255,255,255,0.1);">
    <div style="color:#f0e6d2;font-size:16px;font-weight:700;letter-spacing:3px;">SKETCH TO PHYSICS</div>
    <div style="margin-left:auto;display:flex;gap:12px;">
      <button onclick="goHome()" style="background:rgba(255,255,255,0.08);color:#f0e6d2;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;">Home</button>
      <button onclick="toggleFullscreen()" style="background:rgba(255,255,255,0.08);color:#f0e6d2;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Fullscreen
      </button>
    </div>
  </div>
  <script>
  function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
  function goHome(){window.location.href = (location.hostname === 'localhost') ? 'http://localhost:5175/' : '/cases/lobby/dist/';}
  </script>

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>
  
  <!-- 2D Overlay Canvas for Physics Trajectory Annotations (handwritten style) -->
  <canvas id="annotation-canvas"></canvas>

  <!-- Slow Motion 0.25x Badge -->
  <div id="slow-mo-badge" class="badge-025x hidden">0.25×</div>

  <!-- Tour Notification / Narrative Banner -->
  <div id="tour-banner" class="tour-banner hidden">
    <div class="tour-banner-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
    </div>
    <div class="tour-banner-text" id="tour-banner-text">
      The first throw falls short, so the sketch gets more lead (0.48 kg → 0.68 kg).
    </div>
  </div>

  <!-- Bottom Control Bar: integrated nav + build controls -->
  <div id="bottom-bar" class="bottom-bar">
    <!-- Left: Title + Nav -->
    <div class="bottom-left">
      <div class="brand">
        <h1 class="brand-title">Newton's Cradle</h1>
        <span class="brand-tag">sketch to physics</span>
        <div class="nav-buttons">
          <button id="btn-play-tour" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
            Play the tour
          </button>
          <button id="btn-build-yourself" class="btn btn-secondary">
            Build it yourself
          </button>
        </div>
      </div>
      <div class="zoom-view-stack">
        <div class="zoom-control">
          <div class="zoom-label-row">
            <label class="zoom-label">ZOOM</label>
          </div>
          <div class="zoom-slider-row">
            <span class="zoom-icon">&#8722;</span>
            <input type="range" id="zoom-slider" min="60" max="200" value="160" step="5">
            <span class="zoom-icon">+</span>
          </div>
        </div>
        <div class="view-buttons">
          <span class="view-label">VIEW</span>
          <button id="btn-view-hero" class="view-btn active">Hero</button>
          <button id="btn-view-side" class="view-btn">Side</button>
          <button id="btn-view-top" class="view-btn">Top</button>
          <button id="btn-view-3d" class="view-btn">3D</button>
        </div>
      </div>
    </div>

  <!-- Bottom Center Scrubber Bar (Player UI) -->
  <div id="player-scrubber" class="player-scrubber">
    <div class="tour-steps" id="tour-steps">
      <button class="tour-step" data-step="0">SKETCH</button>
      <button class="tour-step" data-step="1">LIFT</button>
      <button class="tour-step" data-step="2">MODEL</button>
      <button class="tour-step" data-step="3">MATERIAL</button>
      <button class="tour-step" data-step="4">PARTS</button>
      <button class="tour-step" data-step="5">PLAY</button>
      <button class="tour-step" data-step="6">REPLAY</button>
      <button class="tour-step" data-step="7">BUILD</button>
    </div>
    <div class="scrubber-row">
      <div class="scrubber-side scrubber-left">
        <button id="scrubber-mute" class="player-icon-btn" title="Toggle Sound">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </button>
        <div class="scrubber-time" id="scrubber-current-time">00:04</div>
      </div>
      <div class="scrubber-track-container" id="scrubber-container">
        <div class="scrubber-track">
          <div class="scrubber-progress" id="scrubber-progress" style="width: 15%;"></div>
          <div class="scrubber-thumb" id="scrubber-thumb" style="left: 15%;"></div>
        </div>
      </div>
      <div class="scrubber-side scrubber-right">
        <div class="scrubber-controls">
          <button id="scrubber-rw" class="player-icon-btn" title="Rewind">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="11 19 2 12 11 5 11 19"></polygon><polygon points="22 19 13 12 22 5 22 19"></polygon></svg>
          </button>
          <button id="scrubber-play" class="player-icon-btn play-circle" title="Play/Pause">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5"><polygon points="6 4 20 12 6 20 6 4" fill="rgba(37, 99, 235, 0.15)"></polygon></svg>
          </button>
          <button id="scrubber-ff" class="player-icon-btn" title="Fast Forward">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 19 22 12 13 5 13 19"></polygon><polygon points="2 19 11 12 2 5 2 19"></polygon></svg>
          </button>
        </div>
        <div class="scrubber-time" id="scrubber-total-time">01:24</div>
      </div>
    </div>
  </div>

    <!-- Right: Build controls (hidden in tour mode) -->
    <div id="build-panel" class="build-panel hidden">
      <!-- Stats 4-Column Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">SPEED</div>
          <div class="stat-value" id="stat-speed">— m/s</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">POWER</div>
          <div class="stat-value" id="stat-angle">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">RANGE</div>
          <div class="stat-value" id="stat-range">— mm</div>
        </div>
        <div class="stat-card highlight">
          <div class="stat-label">DOWN</div>
          <div class="stat-value"><span id="stat-down-count">0</span>/10</div>
        </div>
      </div>

      <!-- Parameters: BALL (row 1) / WEIGHT (row 2) -->
      <div class="panel-section param-section">
      <div class="ctrl-group ball-group">
        <div class="ctrl-label-row">
          <label>BALL</label>
          <span class="value-badge" id="ball-label">0.10 kg</span>
        </div>
        <input type="range" id="ball-slider" min="0.30" max="0.60" value="0.45" step="0.01"><!-- mirrors src/spec.js UI.ball -->
      </div>

      <!-- Weight slider (row 2 of the BALL/WEIGHT pair) -->
      <div class="ctrl-group weight-group">
        <div class="ctrl-label-row">
          <label>WEIGHT</label>
          <span class="value-badge" id="weight-label">0.68 kg</span>
        </div>
        <input type="range" id="weight-slider" min="1.40" max="10" value="4.80" step="0.01"><!-- mirrors src/spec.js UI.counterweight -->
      </div>
      </div>

      <!-- Throw + Fire + toggles -->
      <div class="panel-section throw-section">
      <div class="throw-group">
        <div class="throw-row">
          <div class="ctrl-group">
            <div class="ctrl-label-row">
              <label>THROW</label>
              <span class="value-badge" id="pull-angle-label">pull 0°</span>
            </div>
            <input type="range" id="pull-slider" min="0" max="135" value="0" step="0.5"><!-- mirrors src/spec.js UI.pull (135° = 45° from mast) -->
          </div>
          <button id="btn-fire" class="btn-fire">Fire</button>
        </div>
        <div class="toggles-row">
          <button id="btn-toggle-slowmo" class="pill-btn">Slow motion</button>
          <button id="btn-toggle-flightpath" class="pill-btn">Flight path</button>
        </div>
      </div>
      </div>

      <!-- Model morph + footer actions -->
      <div class="panel-section model-section">
      <div class="morph-group">
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <label>SKETCH—MODEL</label>
            <span class="value-badge" id="morph-stage">MATERIAL</span>
          </div>
          <input type="range" id="morph-slider" min="0" max="100" value="100" step="1">
          <div class="morph-scale">
            <span class="morph-tick t0"></span>
            <span class="morph-tick t33"></span>
            <span class="morph-tick t66"></span>
            <span class="morph-tick t100"></span>
          </div>
        </div>
        <div class="panel-footer">
          <button id="btn-reset" class="action-btn">Reset</button>
          <button id="panel-sound-btn" class="action-btn icon-only" title="Toggle Sound">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          </button>
        </div>
      </div>
      </div>
    </div>
  </div>

  <!-- Drag Instruction Pill -->
  <div id="drag-hint" class="drag-hint hidden">
      <span class="dot">●</span> Hold the cup, pull down, and let go
  </div>


  <script type="module" src="./src/main.js"></script>
</body>
</html>
