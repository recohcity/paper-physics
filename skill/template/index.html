<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch2Sim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #2e251d; color: #e8e4dc; overflow: hidden; }
  #canvas-container { position: fixed; inset: 0; }
  .panel {
    position: fixed; right: 16px; top: 16px; width: 300px;
    background: rgba(20,22,28,.92); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); z-index: 10;
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  .panel h1 { font-size: 16px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat { background: #2a2f38; border-radius: 8px; padding: 8px; }
  .stat-label { font-size: 10px; opacity: .6; text-transform: uppercase; }
  .stat-value { font-size: 16px; font-weight: 600; }
  .toolbar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar button {
    background: #2a2f38; color: #e8e4dc; border: 1px solid #3a4048;
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px;
  }
  .toolbar button.active { background: #4a9eff; border-color: #4a9eff; }
  .param-section { margin-top: 8px; }
  .ctrl-group { background: #2a2f38; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
  .ctrl-label-row { font-size: 12px; margin-bottom: 4px; }
  .hint { font-size: 11px; opacity: .5; margin-top: 8px; line-height: 1.4; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div class="panel">
  <h1 id="app-title">Sketch2Sim</h1>
  <div class="toolbar">
    <button data-view="front">Front</button>
    <button data-view="iso" class="active">3D</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">ENERGY</div><div class="stat-value">0.000 J</div></div>
    <div class="stat"><div class="stat-label">STATE</div><div class="stat-value">rest</div></div>
  </div>
  <div class="toolbar" id="action-bar">
    <button id="btn-reset">Reset</button>
  </div>
  <div class="param-section" id="param-section"></div>
  <div class="hint" id="hint"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
