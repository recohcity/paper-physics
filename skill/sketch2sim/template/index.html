<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sketch2sim</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<!-- Cream loading overlay — prevents black flash on load -->
<div id="loading-overlay" style="position:fixed;inset:0;background:#f5f0e6;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 0.3s;"></div>

<div id="canvas-container"></div>

<div id="bottom-bar">
  <div class="bottom-left">
    <h1 id="app-title">Mechanism</h1>
    <div class="nav-buttons">
      <button id="btn-play-tour" class="btn primary">▶ Play the tour</button>
      <button id="btn-build" class="btn secondary">Build it yourself</button>
    </div>
    <div class="view-buttons">
      <span>VIEW</span>
      <button data-view="hero" class="view-btn active">Hero</button>
      <button data-view="side" class="view-btn">Side</button>
      <button data-view="top" class="view-btn">Top</button>
      <button data-view="iso" class="view-btn">3D</button>
    </div>
  </div>

  <!-- Build panel: cards go here, see references/panel-layout-standards.md -->
  <div id="build-panel" class="build-panel hidden" style="display:flex;flex-direction:row;gap:6px;align-items:stretch;"></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
