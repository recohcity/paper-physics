<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sketch2sim app</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="canvas-container"></div>

<div id="tour-banner" class="tour-banner hidden">
  <span id="tour-banner-text"></span>
</div>

<div id="bottom-bar">
  <div class="bottom-left">
    <h1 id="app-title">Mechanism</h1>
    <div class="nav-buttons">
      <button id="btn-play-tour" class="btn primary">▶ Tour</button>
      <button id="btn-build" class="btn secondary">Build it yourself</button>
    </div>
    <div class="view-buttons">
      <span>VIEW</span>
      <button data-view="hero" class="view-btn active">Hero</button>
      <button data-view="side" class="view-btn">Side</button>
      <button data-view="top" class="view-btn">Top</button>
      <button data-view="iso" class="view-btn">3D</button>
    </div>
  </div>

  <div id="build-panel" class="build-panel hidden">
    <div id="stats-grid" class="stats-grid"></div>
    <div id="param-section" class="panel-section"></div>
    <div class="panel-section">
      <button id="btn-action" class="action-btn primary">Action</button>
      <button id="btn-reset" class="action-btn">Reset</button>
      <button id="btn-slowmo" class="pill">Slow-mo</button>
    </div>
  </div>
</div>

<div id="drag-hint" class="drag-hint hidden"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
